```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Для тебя ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #ffd6e7,
        #fff0f6,
        #ffc1d8
    );

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Карточка */

.card {
    position: relative;
    z-index: 10;

    width: 92%;
    max-width: 400px;

    padding: 22px 16px 25px;

    text-align: center;

    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(12px);

    border-radius: 30px;

    box-shadow:
        0 15px 50px rgba(220,40,90,0.25);

    animation: appear 1.2s ease;
}

/* Романтичная надпись */

.romantic-title {
    color: #d81b60;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 28px;

    line-height: 1.3;

    font-weight: 600;

    letter-spacing: 0.5px;

    margin-bottom: 20px;

    text-shadow:
        0 2px 10px rgba(216, 27, 96, 0.25);

    animation:
        romanticAppear 1.8s ease forwards,
        romanticGlow 3s ease-in-out 1.8s infinite;
}

/* Появление надписи */

@keyframes romanticAppear {

    from {
        opacity: 0;

        transform:
            translateY(-20px)
            scale(0.9);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

/* Свечение надписи */

@keyframes romanticGlow {

    0%, 100% {
        text-shadow:
            0 2px 10px rgba(216, 27, 96, 0.2);
    }

    50% {
        text-shadow:
            0 2px 20px rgba(216, 27, 96, 0.5);
    }
}

/* Фото */

.photo {
    width: 100%;

    max-height: 410px;

    object-fit: cover;

    border-radius: 22px;

    border: 4px solid white;

    box-shadow:
        0 8px 30px rgba(200,30,80,0.25);

    animation:
        pulse 3s ease-in-out infinite;
}

/* Текст */

p {
    margin-top: 18px;

    color: #7c3450;

    font-size: 17px;

    line-height: 1.5;
}

/* Музыка */

.music {
    margin-top: 20px;

    width: 100%;

    height: 42px;
}

/* Падающие сердечки */

.falling-heart {
    position: fixed;

    top: -60px;

    color: #ff1744;

    font-size: 25px;

    z-index: 2;

    pointer-events: none;

    animation: falling linear infinite;
}

/* Анимация падения */

@keyframes falling {

    0% {
        transform:
            translateY(-60px)
            translateX(0)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        transform:
            translateY(50vh)
            translateX(40px)
            rotate(180deg);
    }

    100% {
        transform:
            translateY(110vh)
            translateX(-40px)
            rotate(360deg);

        opacity: 0;
    }
}

/* Анимация фото */

@keyframes pulse {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.015);
    }
}

/* Появление карточки */

@keyframes appear {

    from {
        opacity: 0;

        transform:
            scale(0.85)
            translateY(30px);
    }

    to {
        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}

/* Экран запуска */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 20;

    background:
        rgba(255,210,225,0.95);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;
}

/* Кнопка */

.start {
    border: none;

    border-radius: 30px;

    padding: 18px 32px;

    background: #e91e63;

    color: white;

    font-size: 18px;

    font-weight: bold;

    box-shadow:
        0 10px 30px rgba(220,40,90,0.3);

    cursor: pointer;

    transition: 0.2s;
}

.start:hover {
    transform: scale(1.05);
}

.start:active {
    transform: scale(0.95);
}
</style>
</head>

<body>

<!-- Падающие сердечки -->

<div class="falling-heart"
     style="left:3%;animation-duration:5s">
    ❤️
</div>

<div class="falling-heart"
     style="left:12%;animation-duration:7s;animation-delay:1s">
    ❤️
</div>

<div class="falling-heart"
     style="left:23%;animation-duration:6s;animation-delay:3s">
    ❤️
</div>

<div class="falling-heart"
     style="left:35%;animation-duration:8s;animation-delay:2s">
    ❤️
</div>

<div class="falling-heart"
     style="left:48%;animation-duration:5.5s;animation-delay:1s">
    ❤️
</div>

<div class="falling-heart"
     style="left:60%;animation-duration:7s;animation-delay:4s">
    ❤️
</div>

<div class="falling-heart"
     style="left:73%;animation-duration:6s;animation-delay:2s">
    ❤️
</div>

<div class="falling-heart"
     style="left:84%;animation-duration:8s;animation-delay:1s">
    ❤️
</div>

<div class="falling-heart"
     style="left:94%;animation-duration:5s;animation-delay:3s">
    ❤️
</div>


<!-- Основная карточка -->

<div class="card">

    <h1 class="romantic-title">
        Ты дарованный Богом<br>
        мне ангел ❤️
    </h1>

    <!-- Фото -->

    <img
        class="photo"
        src="photo.jpg"
        alt="Фото"
    >

    <!-- Текст -->

    <p>
        Ты делаешь этот мир
        <br>
        намного красивее. ❤️
    </p>

    <!-- Музыка -->

    <audio
        id="song"
        class="music"
        src="song.mp3"
        controls
        loop
        preload="auto">
    </audio>

</div>


<!-- Экран запуска -->

<div class="overlay" id="overlay">

    <button
        class="start"
        onclick="startMusic()">

        Нажми сюда ❤️

    </button>

</div>


<script>

function startMusic() {

    const song =
        document.getElementById("song");

    song.volume = 1.0;

    song.play()
        .then(() => {

            document.getElementById("overlay")
                .style.display = "none";

        })
        .catch(() => {

            alert(
                "Не удалось запустить музыку. Проверь, что song.mp3 находится рядом с index.html"
            );

        });
}

</script>

</body>
</html>
```
